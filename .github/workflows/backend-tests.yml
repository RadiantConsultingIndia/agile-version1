name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # main.py runs real ALTER TABLE migrations the moment it's imported (not deferred), including
      # Postgres-specific syntax an in-memory SQLite DB can't run — so functional tests that actually
      # `import main` need a real, working Postgres to connect to, not just a syntactically-valid URL.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test_db
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # test_cloudinary.py and test_db.py are pre-existing, unrelated ad-hoc scripts that need
        # real credentials — deliberately excluded, not fixed here.
        run: pytest -v --ignore=test_cloudinary.py --ignore=test_db.py

name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch: {}  # lets you trigger this manually from the Actions tab, even with no backend changes

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # main.py runs real ALTER TABLE migrations the moment it's imported (not deferred), including
      # Postgres-specific syntax an in-memory SQLite DB can't run — so functional tests that actually
      # `import main` need a real, working Postgres to connect to, not just a syntactically-valid URL.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test_db
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # test_cloudinary.py and test_db.py are pre-existing, unrelated ad-hoc scripts that need
        # real credentials — deliberately excluded, not fixed here. live/ is excluded because it
        # makes real, billed Claude API calls — it runs on its own schedule via ai-eval-live.yml,
        # never on every push.
        run: pytest -v --ignore=test_cloudinary.py --ignore=test_db.py --ignore=live

  static-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        # Report-only for now (continue-on-error) — this is the first time linting has run on this
        # codebase, so it may surface pre-existing issues nobody's reviewed yet. Once we've looked
        # at the first results and cleaned up anything real, remove continue-on-error to make this
        # a hard gate like the "test" job above.
        continue-on-error: true
        run: ruff check .

      - name: Security scan (bandit)
        continue-on-error: true
        # Excludes the test files specifically: they intentionally contain fake credentials
        # (e.g. a dummy SECRET_KEY/API key for CI) that bandit would otherwise flag as real
        # hardcoded secrets, plus the two pre-existing broken scripts already excluded from pytest.
        run: >-
          bandit -r . --exclude
          ./conftest.py,./anthropic_fakes.py,./test_cloudinary.py,./test_db.py,./test_guardrails.py,./test_ai_endpoint_guardrails.py,./test_functional_employer_flow.py,./test_functional_candidate_flow.py,./test_no_pii_in_prompts.py,./test_model_consistency.py
